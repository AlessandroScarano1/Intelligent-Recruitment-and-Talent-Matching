name: talent_matching_nocuda
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10

  # Data processing
  - numpy
  - pandas
  - polars
  - pyarrow
  - duckdb
  - scikit-learn
  - scipy
  - matplotlib
  - pillow

  # PyTorch for Apple Silicon (MPS support)
  - pytorch
  - torchvision
  - torchaudio

  # Vector search (CPU only on macOS)
  - faiss-cpu

  # Big data
  - pyspark=3.5
  - openjdk=11    # Required for Spark

  # Jupyter
  - jupyter
  - ipykernel
  - ipywidgets>=8.0

  # Utilities
  - tqdm
  - unidecode
  - requests
  - python-dotenv
  - pyyaml

  # Pip packages (not available in conda or specific versions)
  - pip
  - pip:
      # ML/NLP
      - sentence-transformers>=2.2
      - transformers>=4.30
      - accelerate
      - datasets
      - gliner
      - huggingface-hub
      - spacy==3.7
      - onnxruntime

      # Kafka
      - confluent-kafka>=2.0

      # Document parsing
      - unstructured[all-docs]
      - python-docx
      - pypdf
      - pdfplumber
      - pymupdf

      # File monitoring
      - watchdog>=3.0

      # Web UI
      - streamlit
      - gdown

      # Delta Lake
      - delta-spark

      # Experiment tracking
      - wandb

      # Validation
      - pydantic>=2.0

# Post-install commands
# After creating environment, run:
#   python -m spacy download en_core_web_sm
#   python -m spacy download en_core_web_lg
